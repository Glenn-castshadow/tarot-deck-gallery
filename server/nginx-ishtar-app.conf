    # Inserted into /etc/nginx/sites-available/ishtarinsights.com's server
    # block by deploy-app.sh, immediately before `location / {`.
    #
    # Deliberately has no /api/newsletter/ location: that path is already
    # live, proxied to the old ishtar-newsletter service on 127.0.0.1:8137 by
    # a location block deploy-newsletter.sh installed earlier, and nothing in
    # this task may stop, disable, or reconfigure that service -- cutting
    # /api/newsletter/ over to this app's own implementation on 8138 is a
    # separate, deliberate step (see docs/ACCOUNTS.md, "Newsletter cutover").
    #
    # That is also why the regex below enumerates account|readings|health
    # instead of matching the whole /api/ prefix: nginx gives an unanchored
    # regex location priority over a matching plain-prefix location
    # regardless of which is more specific -- a prefix location only wins
    # outright with the `^~` modifier (nginx docs, `location` directive) --
    # so a blanket `^/(api|_allauth|admin)/` pattern here would silently
    # steal /api/newsletter/* onto port 8138 even without a newsletter block
    # of its own. Checked against nginx's documented location-matching
    # algorithm; not tested against a live nginx instance (none available in
    # this dev environment).
    #
    # Unrelated to the block below, but required by the same site: since
    # site-foundation (2026-09-13) the static content is no longer one
    # index.html but a hub plus seven directories (/tarot/, /sky/, /charts/,
    # /eastern/, /numerology/, /divination/, /account/), each with its own
    # index.html. This server block's existing `location / {` MUST read
    # `try_files $uri $uri/ =404;` -- not a bare `try_files $uri =404;` --
    # so that a directory request falls through to nginx's own `index`
    # directive and serves that directory's index.html. This also gets the
    # trailing slash right for free: nginx's try_files only accepts the
    # `$uri/` alternative when it resolves to a real directory, and when it
    # does, a request for the no-slash form (e.g. /tarot) is 301-redirected
    # to the slash form (/tarot/) before being served -- exactly the pair
    # `curl -I` should show (200 for /tarot/, 301 for /tarot). Skipping this
    # rule, or leaving `location /` on a file-only `try_files`, 404s every
    # topic page except the hub. The dev static server this app is verified
    # against already implements this same rule; this comment just carries
    # the requirement into the VPS config, which this deploy does not touch.
    location ~ ^/(api/(account|readings|health)|_allauth|admin)/ {
        client_max_body_size 16k;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8138;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }
    location /static/ {
        proxy_pass http://127.0.0.1:8138;
        proxy_set_header Host $host;
        expires 7d;
    }
