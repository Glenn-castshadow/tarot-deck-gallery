<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#20152b">
    <title>Today's sky · Ishtar Insights</title>
    <meta name="description" content="Daily horoscopes for every sign from the calculated tropical sky.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Today's sky · Ishtar Insights">
    <meta property="og:description" content="Daily horoscopes for every sign from the calculated tropical sky.">
    <meta property="og:image" content="https://ishtarinsights.com/assets/celestial-hero.webp">
    <meta property="og:url" content="https://ishtarinsights.com/sky/">
    <link rel="canonical" href="https://ishtarinsights.com/sky/">
    <link rel="preload" href="/assets/fonts/dm-sans-latin-400-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/playfair-display-latin-600-800.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/fonts.css?v=1">
    <link rel="stylesheet" href="/styles.css?v=site-shell-2">
    <link rel="stylesheet" href="/site-shell.css?v=7">
    <link rel="stylesheet" href="/account.css?v=c5-2">
    <link rel="stylesheet" href="/daily-horoscope.css?v=3">
    <link rel="stylesheet" href="/sky-calendar.css?v=6">
    <link rel="stylesheet" href="/mobile-sections.css?v=2">
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <main class="shell">
      <div data-shell="header"></div>
      <div data-shell="nav"></div>

      <section class="reading-room" aria-label="Today's sky">
        <section id="daily-horoscope" class="daily-horoscope" aria-labelledby="daily-horoscope-title" data-fold="Daily horoscope" data-fold-key="daily-horoscope" data-fold-subtitle="Your sign · today’s sky · a moment of reflection"></section>
        <section id="sky-calendar" class="sky-calendar" aria-labelledby="sky-calendar-title" data-fold="The sky this month" data-fold-key="sky-calendar" data-fold-subtitle="The Moon · this month · retrogrades · your transits" data-room="transit-calendar"></section>
      </section>

      <div data-shell="footer"></div>
    </main>

    <dialog id="account-dialog" class="account-dialog" aria-labelledby="account-dialog-title">
      <button type="button" class="close-dialog" data-close-account aria-label="Close sign in">×</button>
      <form id="account-email-form" class="account-step"><p class="section-kicker">Sign in or create an account</p><h2 id="account-dialog-title">A code, not a password</h2><p>Enter your email and we will send a one-time code. No password to remember. New emails create an account.</p><label for="account-email-input">Email address</label><input id="account-email-input" type="email" required autocomplete="email" maxlength="254" placeholder="you@example.com"><button type="submit">Send my code</button><p class="account-fine">Signing in sets a session cookie that is needed for your account to work. See <a href="/cookie-policy.html">cookies &amp; browser storage</a>.</p></form>
      <form id="account-code-form" class="account-step" hidden><p class="section-kicker">Check your email</p><h2>Enter the code</h2><p id="account-code-hint"></p><label for="account-code-input">Code</label><input id="account-code-input" type="text" inputmode="text" autocomplete="one-time-code" required maxlength="12" autocapitalize="characters" spellcheck="false"><button type="submit">Sign in</button><button type="button" class="text-button" id="account-resend">Send a new code</button><button type="button" class="text-button" id="account-restart">Use a different email</button></form>
      <p id="account-dialog-status" role="status" aria-live="polite"></p>
    </dialog>
    <div data-shell="notice"></div>
    <script src="/site-shell.js?v=11"></script>
    <script>SiteShell.mount('sky');</script>
    <script src="/rooms.js?v=c5-kinds-1"></script>
    <script src="/storage-preferences.js?v=sun-sign-1"></script>
    <script src="/account-core.js?v=newsletter-sign-1"></script>
    <script src="/account.js?v=pages-5"></script>
    <script src="/birthday-insights.js?v=celestial-atlas-1"></script>
    <script src="/vendor/astronomy-engine/astronomy.browser.min.js?v=2.1.19"></script>
    <script src="/natal-engine.js?v=c5-1"></script>
    <script src="/daily-horoscope-engine.js?v=2"></script>
    <script src="/daily-horoscope.js?v=4"></script>
    <script src="/birth-lore.js?v=2"></script>
    <script src="/birth-profile.js?v=1"></script>
    <script src="/natal-room.js?v=10"></script>
    <script>
      // A journal entry opened from /account/ arrives here as ?reading=<id>. The rooms only
      // register once account.js has dispatched the first signed-in state, so wait for it.
      document.addEventListener('ishtar-account-change', async function once(event) {
        if (!event.detail.signedIn) return;
        document.removeEventListener('ishtar-account-change', once);
        const result = await Rooms.openFromQuery({
          search: location.search,
          getReading: id => IshtarAccount.getReading(id),
          scrollTo: room => document.querySelector(`[data-room~="${room.kind}"]`)?.scrollIntoView({block: 'start'})
        });
        if (result === 'unknown' || result === 'failed') IshtarAccountUI.openPanel('This reading cannot be replayed on this page version.');
      });
    </script>
    <script src="/sky-calendar-engine.js?v=4"></script>
    <script src="/sky-calendar-text.js?v=2"></script>
    <script src="/sky-calendar.js?v=7"></script>
    <script src="/mobile-sections.js?v=data-fold-4"></script>
  </body>
</html>
